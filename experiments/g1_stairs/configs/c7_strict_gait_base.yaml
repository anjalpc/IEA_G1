schema_version: 1
inheritance:
  base_config: experiments/g1_stairs/configs/c6_4_centered_shaping.yaml
  resolved_config_required: true

experiment:
  id: c7_strict_gait_base
  purpose: >
    Paper-aligned strict gait architecture: exact coordinated foothold XYZ
    observation, centered full-sole landings, alternating physical contract,
    pre-liftoff support transfer shaping, and reduced ascent velocity pressure.
    Base only; use prepare_c7.py to generate runnable smoke/train leaves.

observations:
  preferred_transition_foot: true
  preferred_foothold: false
  preferred_foothold_ablation: false
  coordinated_foothold_xyz: true
  gait_phase: true
  actor_height_scan: false
  critic_height_scan: true

acquisition_credit:
  require_first_touchdown_placement: true
  dynamic_alternating_reward_gating: true

episode_contract:
  strict_stair_gait: true

gait:
  enabled: true
  coordinated_motion: true
  outcome_conditioned_motion: true
  adaptive_timing: true
  swing_weight: 0.35
  stance_weight: 0.20
  prelift_weight: 0.25
  placement_weight: 0.40
  transfer_weight: 0.30
  lateral_weight: 0.15
  arm_weight: 0.15
  finish_weight: 0.15

reward_experiment:
  active_stage: geometry_locomotion_c7_strict
  strict_runtime_set: true
  rewards:
    stage_plan:
      geometry_locomotion_c7_strict:
        track_stair_axis_velocity: 1.0
        track_ang_vel_z: 0.5
        stair_centerline_error: -0.5
        upright: -5.0
        base_angular_velocity: -0.05
        joint_acc: -2.5e-07
        action_rate: -0.05
        dof_pos_limits: -5.0
        feet_slide: -0.2
        undesired_contacts: -5.0
        terrain_relative_clearance: 1.0
        forward_insertion: 1.0
        stable_platform_finish: 2.0
        finish_planar_velocity_error: -0.15
        finish_centerline_error: -0.05
        body_heading_guard: -0.1
        geometry_failure_termination_event: -1.0
        first_touchdown_placement: 0.5
        preferred_transition_milestones: 1.0
        coordinated_motion: -1.0
        phase_swing_contact: 0.0

reward_parameters:
  # Inherited from the old arm-guard lineage, but C7 intentionally does not
  # activate posture_envelope_guard. reward_runtime requires inactive inherited
  # parameter blocks to be explicitly removed.
  posture_envelope_guard: null

  track_stair_axis_velocity:
    target_velocity_mps: 0.35
    std_mps: 0.25
    command_name: base_velocity
    ascent_scale: 0.25
  terrain_relative_clearance:
    tread_margin_m: 0.025
    insertion_target_m: 0.010
  forward_insertion:
    tread_margin_m: 0.025
    insertion_target_m: 0.010
