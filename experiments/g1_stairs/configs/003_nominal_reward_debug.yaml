schema_version: 1

experiment:
  id: 003_nominal_reward_debug
  purpose: Experiment B - add upright posture reward to nominal stair progress
  type: tiny_overfit_learning_test
  meaningful_stair_training: true

inheritance:
  base_config: experiments/g1_stairs/configs/nominal_stairs_base.yaml
  resolved_config_required: true

reward_experiment:
  active_stage: B_add_upright
  rule: Change only one reward group between experiments
  reject_change_if:
    - validation_success_decreases
    - fall_rate_increases
    - forbidden_contacts_increase
    - torque_violations_increase
    - motion_jerk_increases_badly

rewards:
  always_logged:
    forward_progress_raw:
      active_weight: 1.0
    stair_progress_raw:
      active_weight: 1.0
    upright_raw:
      active_weight: -1.0

  stage_plan:
    A_progress_only:
      enabled_terms:
        forward_progress_raw: 1.0
        stair_progress_raw: 1.0

    B_add_upright:
      enabled_terms:
        upright_raw: -1.0
