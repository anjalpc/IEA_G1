schema_version: 1

experiment:
  id: specialist_single_step_qual50
  purpose: >
    Fifty-iteration post-audit learning qualification for the geometry-driven
    single-step specialist. Used to verify genuine foot approach, swing
    discovery, survival, and stair progression before long PPO training.
  type: learning_qualification
  meaningful_stair_training: true

inheritance:
  base_config: experiments/g1_stairs/configs/specialist_single_step_base.yaml
  resolved_config_required: true

execution:
  environments: 256
  maximum_iterations: 50
  training_seed: 42

launch_gates:
  allow_launch: true
