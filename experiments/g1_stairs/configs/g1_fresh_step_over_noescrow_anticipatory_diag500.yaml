schema_version: 1

inheritance:
  base_config: experiments/g1_stairs/configs/g1_fresh_step_over_noescrow_diag500.yaml
  resolved_config_required: true

experiment:
  id: g1_fresh_step_over_noescrow_anticipatory_diag500
  purpose: >
    Test whether bounded true vertical anticipatory clearance progress reduces
    first-riser toe-side strikes in the fresh 4 cm curriculum. All no-escrow
    mechanics, acquisition, alternation, PPO, initialization and curriculum
    contracts remain unchanged.

reward_experiment:
  rewards:
    stage_plan:
      geometry_locomotion_clean:
        anticipatory_clearance_progress: 0.5

reward_parameters:
  anticipatory_clearance_progress:
    start_distance_m: 0.22
    full_clearance_distance_m: 0.05
    clearance_margin_m: 0.015
    support_advantage_start_n: 0.0
    support_advantage_full_n: 60.0
    max_credit_vertical_speed_mps: 0.60
