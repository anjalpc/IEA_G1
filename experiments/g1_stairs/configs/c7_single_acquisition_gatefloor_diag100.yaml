schema_version: 1
code:
  project_branch: g1-stair-rl
  project_commit: resolved_from_clean_worktree_at_launch
  require_clean_worktree: true
  unitree_rl_lab_commit: 4960b84732b0c2ec593dccbfe963fda1bcd7b1e3
software:
  isaac_sim: 5.1.0
  isaac_lab_release: 2.3.0
  isaac_lab_tag: v2.3.0
  isaac_lab_commit: 3c6e67bb5c7ada942a6d1884ab69338f57596f77
  rsl_rl: 3.0.1
execution:
  provider: aws
  instance_type: g6.4xlarge
  device: cuda:0
  headless: true
  environments: 2048
  maximum_iterations: 100
  training_seed: 42
  evaluation_seeds:
  - 1001
  - 1002
  - 1003
  - 1004
  - 1005
  deterministic_torch: false
task:
  id: Unitree-IEA-G1-29dof-Stairs-v0
  custom_stair_task_active: true
  episode_length_s: 24.0
  objective: Approach and climb exactly three stairs, reach 0.20 m onto the upper
    platform, stop, and remain stably supported for 1.0 s.
robot:
  variant: G1_EDU_U7
  mode_machine: 5
  policy_dofs: 29
  asset: G1_GEOMETRY_LOCOMOTION_ROBOT_CFG
  asset_revision: official_29dof_usd_with_deployment_pd_contract
  brainco_hands:
    physically_present_on_robot: true
    included_in_this_debug_asset: false
    locomotion_action_channels: 0
    required_before_final_training: true
timing:
  physics_timestep_s: 0.005
  physics_frequency_hz: 200
  decimation: 4
  control_timestep_s: 0.02
  control_frequency_hz: 50
  policy_frequency_hz: 50
  observation_latency_s: 0.0
  action_latency_s: 0.0
observations:
  history_length: 5
  corruption_enabled: false
  concatenated: true
  policy_order:
  - base_angular_velocity
  - projected_gravity
  - velocity_command
  - joint_position_offset
  - joint_velocity
  - previous_action
  - explicit_stair_geometry
  additions:
    local_terrain_height_scan:
      frame: yaw_aligned_robot_frame
      clipping:
      - -1.0
      - 1.0
      sensor: height_scanner
      actor_input: false
      critic_input: true
  deployment_warning: Actor uses only deployable 480-D locomotion history plus 5-D
    explicit stair geometry; terrain height scan is critic-only.
  action_history_included: true
  terrain_scan_in_actor: false
  terrain_scan_in_critic: true
  actor_height_scan: false
  critic_height_scan: true
  preferred_transition_foot: true
  preferred_foothold: false
  preferred_foothold_ablation: false
  gait_phase: true
  coordinated_foothold_xyz: true
actions:
  type: joint_position_offset
  dimension: 30
  scale: 0.25
  clipping: resolved_from_upstream_environment
  use_default_joint_offset: true
  smoothing: none
  joint_order:
  - left_hip_pitch_joint
  - right_hip_pitch_joint
  - waist_yaw_joint
  - left_hip_roll_joint
  - right_hip_roll_joint
  - waist_roll_joint
  - left_hip_yaw_joint
  - right_hip_yaw_joint
  - waist_pitch_joint
  - left_knee_joint
  - right_knee_joint
  - left_shoulder_pitch_joint
  - right_shoulder_pitch_joint
  - left_ankle_pitch_joint
  - right_ankle_pitch_joint
  - left_shoulder_roll_joint
  - right_shoulder_roll_joint
  - left_ankle_roll_joint
  - right_ankle_roll_joint
  - left_shoulder_yaw_joint
  - right_shoulder_yaw_joint
  - left_elbow_joint
  - right_elbow_joint
  - left_wrist_roll_joint
  - right_wrist_roll_joint
  - left_wrist_pitch_joint
  - right_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_wrist_yaw_joint
  physical_joint_dimension: 29
commands:
  forward_velocity_mps:
  - 0.35
  - 0.35
  lateral_velocity_mps:
  - 0.0
  - 0.0
  yaw_velocity_radps:
  - 0.0
  - 0.0
terrain:
  type: fixed_three_step_ascent
  direction: positive_x
  course_size_m:
  - 5.75
  - 1.2
  approach_length_m: 2.0
  riser_height_m: 0.04
  tread_depth_m: 0.25
  step_count: 3
  stair_run_m: 0.75
  total_rise_m: 0.12
  platform_length_m: 3.0
  required_platform_continuation_m: 0.2
  platform_starts_immediately_after_third_tread: true
  collision_representation: non_overlapping_trimesh_boxes
  horizontal_resolution_m: 0.05
  vertical_resolution_m: 0.005
  curriculum_enabled: false
  riser_height_range_m:
  - 0.04
  - 0.04
  riser_heights_m:
  - 0.04
  curriculum:
    enabled: false
    initial_max_level: 0
    platform_margin_m: 0.1
    minimum_upright_gravity_z: 0.75
    minimum_base_clearance_m: 0.55
    minimum_nonflat_env_fraction: 0.75
    require_strict_success_for_promotion: true
reset_distribution:
  base_pose: fixed
  base_pose_offset: fixed_zero
  base_velocity: fixed_zero
  joint_position_scale:
  - 1.0
  - 1.0
  joint_velocity_radps:
  - 0.0
  - 0.0
domain_randomization:
  enabled: false
  rigid_body_material: false
  added_mass: false
  pushes: false
  observation_noise: false
  action_latency: false
rewards:
  aggregation: weighted_sum_per_step
  clipping: none
  always_logged:
    forward_progress_raw:
      formula: base_position_x_t_minus_base_position_x_previous
      units: m_per_step
      active_weight: 0.0
    upward_progress_raw:
      formula: positive_part_of_base_height_t_minus_base_height_previous
      units: m_per_step
      active_weight: 0.0
    stair_progress_raw:
      formula: maximum_step_index_reached_minus_previous_maximum_step_index
      units: steps
      active_weight: 0.0
    platform_entry_raw:
      formula: first_entry_onto_upper_platform
      threshold_robot_relative_x_m: 1.75
      active_weight: 0.0
    task_completion_raw:
      formula: first_crossing_of_required_post_stair_distance
      threshold_robot_relative_x_m: 1.95
      active_weight: 0.0
    upright_raw:
      formula: squared_xy_projected_gravity
      interpretation: zero_when_upright_increases_with_tilt
      active_weight: 0.0
    forbidden_contact_raw:
      formula: count_of_new_forbidden_contact_events
      active_weight: 0.0
    fall_raw:
      formula: first_transition_into_fall_state
      active_weight: 0.0
    feet_clearance_raw:
      formula: foot_clearance_tracking_error
      active_weight: 0.0
    feet_slip_raw:
      formula: stance_foot_horizontal_slip_speed
      active_weight: 0.0
    joint_limit_raw:
      formula: joint_limit_violation_magnitude
      active_weight: 0.0
    velocity_limit_raw:
      formula: joint_velocity_limit_violation_magnitude
      active_weight: 0.0
    torque_limit_raw:
      formula: actuator_torque_limit_violation_magnitude
      active_weight: 0.0
    action_rate_raw:
      formula: squared_action_difference
      active_weight: 0.0
    joint_jerk_raw:
      formula: finite_difference_joint_acceleration
      active_weight: 0.0
    mechanical_power_raw:
      formula: sum_absolute_joint_torque_times_joint_velocity
      active_weight: 0.0
terminations:
  inherited:
  - timeout
  - base_height_fall
  - bad_orientation_fall
  independent_stair_success_evaluator_active: false
  reason: Simulator-independent evaluator exists; live Isaac Lab adapter remains required
curriculum:
  terrain_riser_height:
    enabled: true
    range_m:
    - 0.04
    - 0.2
    initial_level: 0
  command_curriculum:
    enabled: false
policy_initialization:
  type: rsl_rl_checkpoint_actor_transfer
  source:
    task: C6.4_model2049_expanded_for_C7
    path: /workspace/IEA_G1/experiments/g1_stairs/outputs/initialization/c7_model2049_actor492_actions30.pt
    sha256: 99ce5fcdea362c10041602a8bf5d0545f9b1c706b157eab093057643f523cca8
  locomotion_observations: 480
  terrain_observations: 0
  actor_height_scan_observations: 0
  explicit_geometry_observations: 5
  stair_observations: 492
  actions: 30
  new_observation_initialization: zero
  critic_initialization: fresh
  pretrained_actor_trainable: true
  optimizer_initialization: fresh
  transition_state_observations: 2
  gait_phase_observations: 2
  coordinated_foothold_observations: 3
ppo:
  rollout_steps_per_environment: 24
  actor_hidden_dimensions:
  - 512
  - 256
  - 128
  critic_hidden_dimensions:
  - 512
  - 256
  - 128
  activation: elu
  initial_action_noise_std: 0.15
  value_loss_coefficient: 1.0
  clipped_value_loss: true
  clip_range: 0.2
  entropy_coefficient: 0.005
  learning_epochs: 5
  minibatches: 4
  learning_rate: 0.0001
  learning_rate_schedule: adaptive
  discount_gamma: 0.99
  gae_lambda: 0.95
  desired_kl: 0.01
  maximum_gradient_norm: 1.0
  observation_normalization: false
checkpointing:
  upstream_interval_iterations: 500
  require_final_smoke_checkpoint: true
  never_overwrite: true
  attach_project_commit: true
  attach_resolved_config: true
  calculate_sha256: true
  interval_iterations: 10
  save_new_best_validation: true
  preserve_optimizer_state: true
  filename_fields:
  - run_id
  - iteration
  - simulated_steps
  best_training_candidate:
    enabled: false
required_outputs:
- resolved_config.yaml
- run_manifest.yaml
- console.log
- environment.log
- tensorboard
- final_checkpoint
- checkpoint_sha256
acceptance:
  isaac_sim_starts: true
  task_registration_succeeds: true
  gpu_is_used: true
  observations_are_finite: true
  actions_are_finite: true
  checkpoint_is_written: true
  logs_are_written: true
  checkpoint_can_be_downloaded: true
  simulator_error_count: 0
  nan_count: 0
  resets_succeed: true
  action_dimension: 30
start_pose:
  distribution: fixed
  terrain_origin_m:
  - 1.0
  - 0.6
  - 0.0
  base_height_from_robot_asset_m: 0.8
  orientation_rpy_rad:
  - 0.0
  - 0.0
  - 0.0
  distance_before_first_riser_m: 1.0
  lateral_offset_m: 0.0
  position_randomization_m:
  - 0.0
  - 0.0
  - 0.0
  yaw_randomization_rad: 0.0
hard_blockers:
- nan_detected
- infinity_detected
- tensor_shape_mismatch
- invalid_reset
- unstable_physics
- corrupted_checkpoint
launch_gates:
  independent_evaluator_implemented: true
  essential_metrics_implemented: true
  fixed_evaluation_cameras_implemented: true
  aws_upstream_validation_passed: true
  staircase_geometry_validation_passed: true
  allow_launch: true
metric_deferrals:
  approximate_kl:
    reason: RSL-RL 3.0.1 computes adaptive KL internally but does not expose it in
      loss_dict
    required_before: PPO ablation studies
  clip_fraction:
    reason: RSL-RL 3.0.1 does not expose clipped-sample fraction
    required_before: PPO ablation studies
  automatic_periodic_evaluation:
    reason: Checkpoints are persisted every 50 iterations; independent evaluation
      is launched separately
    required_before: final multi-seed checkpoint selection
success_definition:
  independent_from_reward: true
  requirements:
    approach_staircase: true
    ascend_step_1: true
    ascend_step_2: true
    ascend_step_3: true
    reach_upper_platform: true
    travel_after_final_step_m: 0.2
    upright_dwell_s: 1.0
    forbidden_contacts: false
    joint_limit_violation: false
    velocity_limit_violation: false
    torque_limit_violation: false
fall_definition:
  any_of:
    base_height_below_m: 0.45
    absolute_roll_above_rad: 0.8
    absolute_pitch_above_rad: 0.8
    torso_contact: true
    pelvis_contact: true
    invalid_simulation_state: true
failure_categories:
  primary_priority_order:
  - invalid_simulation_state
  - fall
  - torque_violation
  - velocity_violation
  - joint_violation
  - forbidden_contact
  - wrong_direction
  - slip
  - stall
  - timeout
  preserve_secondary_flags: true
forbidden_contacts:
- torso
- pelvis
- left_knee
- right_knee
- left_forearm
- right_forearm
- left_hand
- right_hand
evaluation:
  interval_iterations: 50
  episodes_per_seed: 20
  screening_episode_total: 100
  training_seeds_excluded: true
  select_by_training_return: false
  candidate_score_components:
  - success_rate
  - fall_rate
  - forbidden_contact_rate
  - constraint_compliance
  - stability
  - action_smoothness
essential_metrics:
  rewards:
  - total
  - every_raw_component
  - every_weighted_component
  outcomes:
  - success
  - fall
  - timeout
  - stall
  - slip
  - forbidden_contact
  progress:
  - maximum_x
  - maximum_base_height
  - maximum_step_reached
  - platform_reached
  - final_distance_after_platform
  constraints:
  - joint_limit_violations
  - velocity_limit_violations
  - torque_limit_violations
  - action_saturation_count
  motion:
  - action_rate
  - joint_jerk
  - mechanical_power
  ppo:
  - policy_loss
  - value_loss
  - entropy
  - approximate_kl
  - clip_fraction
  - learning_rate
  performance:
  - simulation_fps
  - environment_steps_per_second
  - gpu_memory
  - wall_clock_time
  - nan_count
recording:
  training_rendering: false
  periodic_evaluation_video: true
  camera_views:
  - side
  - front
  - foot_close_up
  - slow_motion_contact
  associate_video_with_checkpoint: true
stop_conditions:
- any_nan_or_infinity
- invalid_reset
- unstable_physics
- success_rate_not_improving_after_defined_review_window
- reward_increases_while_safety_metrics_worsen
- repeated_collision_exploitation
