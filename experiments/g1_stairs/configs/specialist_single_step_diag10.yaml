schema_version: 1

experiment:
  id: specialist_single_step_diag10
  purpose: >
    Ten-iteration diagnostic only after the single-step smoke passes. Used to
    inspect physical progression and reward distributions before any longer
    PPO run.
  type: diagnostic_learning
  meaningful_stair_training: true

inheritance:
  base_config: experiments/g1_stairs/configs/specialist_single_step_base.yaml
  resolved_config_required: true

execution:
  environments: 256
  maximum_iterations: 10
  training_seed: 42

launch_gates:
  allow_launch: true
