schema_version: 1
experiment:
  id: geometry_locomotion_v03_flat4_diag100
  purpose: Diagnose fixed flat/4 cm traversal with shared physical outcomes.
  type: geometry_conditioned_locomotion_contract_gate
  meaningful_stair_training: true
inheritance:
  base_config: experiments/g1_stairs/configs/geometry_locomotion_v02b_curriculum100.yaml
  resolved_config_required: true
terrain:
  riser_height_m: 0.04
  riser_heights_m: [0.0, 0.04]
  curriculum:
    enabled: false
# Explicit opt-in; older experiments retain their original outcome definitions.
episode_contract:
  enabled: true
  platform_continuation_m: 2.0
  supported_dwell_s: 1.0
  minimum_base_clearance_m: 0.45
  maximum_roll_pitch_rad: 0.8
  forbidden_contact_force_n: 1.0
  support_force_n: 30.0
  sole_height_tolerance_m: 0.025
  boundary_margin_m: 0.15
  stall_duration_s: 2.0
  progress_epsilon_m: 0.02
  wrong_direction_tolerance_m: 0.25
# Configuration inheritance is NOT checkpoint continuation. This diagnostic
# deliberately starts from the unchanged Unitree actor with a fresh critic.
policy_initialization:
  type: unitree_velocity_onnx_transfer
execution:
  environments: 2048
  maximum_iterations: 100
  training_seed: 42
