schema_version: 1

inheritance:
  base_config: experiments/g1_stairs/configs/albert_flat_gait50.yaml
  resolved_config_required: true

experiment:
  id: albert_three04_foot_riser1000
  purpose: Learn three 4 cm steps from the preserved model120 gait with per-foot riser distance.

execution:
  environments: 2048
  maximum_iterations: 1000
  training_seed: 42

checkpointing:
  interval_iterations: 50

terrain:
  riser_height_m: 0.04
  riser_heights_m: [0.04]
  tread_depth_m: 0.25
  step_count: 3
  stair_run_m: 0.75
  total_rise_m: 0.12
  curriculum:
    enabled: false

observations:
  foot_riser_distance: true

policy_initialization:
  type: rsl_rl_checkpoint_actor_transfer
  source:
    task: albert_model120_expanded_with_foot_riser_distance
    path: /workspace/IEA_G1/experiments/g1_stairs/outputs/initialization/albert_model120_actor487_foot_riser.pt
  locomotion_observations: 480
  explicit_geometry_observations: 5
  foot_riser_distance_observations: 2
  stair_observations: 487
  actions: 29
  new_observation_initialization: zero
  critic_initialization: fresh
  optimizer_initialization: fresh
  pretrained_actor_trainable: true

ppo:
  learning_rate: 3.0e-05
  learning_rate_schedule: fixed
  initial_action_noise_std: 0.15
