schema_version: 1

inheritance:
  base_config: experiments/g1_stairs/configs/albert_flat050_train100.yaml
  resolved_config_required: true

experiment:
  id: albert_flat050_axis_heading100
  purpose: >
    Preserve the 0.50 m/s flat gait while closing the verified body-frame
    velocity loophole. Track world stair-axis velocity and bound heading
    deviation. No anti-stall or centerline-position penalty.

execution:
  environments: 512
  maximum_iterations: 100
  training_seed: 42

checkpointing:
  interval_iterations: 10

reward_experiment:
  active_stage: albert_flat050_axis_heading
  strict_runtime_set: true
  rewards:
    stage_plan:
      albert_flat050_axis_heading:
        track_stair_axis_velocity: 1.0
        track_ang_vel_z: 0.5
        body_heading_guard: -0.1
        alive: 0.15
        upright: -5.0
        base_angular_velocity: -0.05
        joint_vel: -0.001
        joint_acc: -2.5e-7
        action_rate: -0.05
        dof_pos_limits: -5.0
        energy: -2.0e-5
        joint_deviation_arms: -0.1
        joint_deviation_waists: -1.0
        joint_deviation_legs: -1.0
        gait: 0.5
        feet_slide: -0.2
        undesired_contacts: -1.0
        forward_stall: 0.0

reward_parameters:
  track_stair_axis_velocity:
    target_velocity_mps: 0.50
    std_mps: 0.25
  body_heading_guard:
    free_yaw_rad: 0.10
    zero_at_yaw_rad: 0.35
