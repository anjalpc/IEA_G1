schema_version: 1
experiment:
  id: footstep_bootstrap04
  purpose: Initial 4 cm planned-footstep PPO diagnostic from official Unitree locomotion
    prior
  type: footstep_curriculum_bootstrap
  meaningful_stair_training: false
inheritance:
  base_config: experiments/g1_stairs/configs/nominal_stairs_base.yaml
  resolved_config_required: true
code:
  project_branch: g1-geometry-locomotion
  require_clean_worktree: true
task:
  id: Unitree-IEA-G1-29dof-Stairs-Footsteps-v0
  custom_stair_task_active: true
terrain:
  riser_height_m: 0.04
  # Mixed: ~half the envs on flat tiles (no plan, joystick range),
  # half on 4 cm stairs (footstep plan). Levels are assigned at random.
  riser_heights_m:
  - 0.0
  - 0.04
  tread_depth_m: 0.25
  step_count: 3
  curriculum_enabled: false
command:
  terrain_split:
    # Unitree's own joystick limits, so flat walking keeps all its skills.
    flat:
      lin_vel_x: [-0.5, 1.0]
      lin_vel_y: [-0.3, 0.3]
      ang_vel_z: [-0.2, 0.2]
      rel_standing_envs: 0.02
    # Stairs: forward only; speed varies per command so climbing is not
    # tied to one speed.
    stairs:
      lin_vel_x: [0.2, 0.5]
execution:
  environments: 2048
  maximum_iterations: 500
  training_seed: 42
# Residual on the frozen official Unitree policy: the teacher always produces
# its normal walking from the 480-D locomotion prefix; the trained actor sees
# all 688 inputs (height scan, stair geometry, footsteps) and adds a bounded
# correction. Iteration 0 equals the Unitree policy exactly.
policy_initialization:
  type: zero_residual_actor
  critic_initialization: fresh
  optimizer_initialization: fresh
  locomotion_observations: 480
  terrain_observations: 187
  explicit_geometry_observations: 5
  planned_footstep_observations: 14
  gait_clock_observations: 2
  stair_observations: 688
  actions: 29
balance_residual_control:
  enabled: true
  teacher_onnx: /workspace/unitree_rl_lab/deploy/robots/g1_29dof/config/policy/velocity/v0/exported/policy.onnx
  teacher_observation_dim: 480
  # Raw Unitree action units (x 0.25 rad). Legs: up to +-2 units = +-0.5 rad
  # for riser lift and foot placement; waist and arms stay near the teacher.
  residual_clip: 2.0
  executed_clip: 5.0
  scale_by_joint:
    left_hip_pitch_joint: 1.00
    right_hip_pitch_joint: 1.00
    waist_yaw_joint: 0.15
    left_hip_roll_joint: 0.30
    right_hip_roll_joint: 0.30
    waist_roll_joint: 0.15
    left_hip_yaw_joint: 0.30
    right_hip_yaw_joint: 0.30
    waist_pitch_joint: 0.15
    left_knee_joint: 1.00
    right_knee_joint: 1.00
    left_shoulder_pitch_joint: 0.10
    right_shoulder_pitch_joint: 0.10
    left_ankle_pitch_joint: 1.00
    right_ankle_pitch_joint: 1.00
    left_shoulder_roll_joint: 0.10
    right_shoulder_roll_joint: 0.10
    left_ankle_roll_joint: 0.30
    right_ankle_roll_joint: 0.30
    left_shoulder_yaw_joint: 0.10
    right_shoulder_yaw_joint: 0.10
    left_elbow_joint: 0.10
    right_elbow_joint: 0.10
    left_wrist_roll_joint: 0.05
    right_wrist_roll_joint: 0.05
    left_wrist_pitch_joint: 0.05
    right_wrist_pitch_joint: 0.05
    left_wrist_yaw_joint: 0.05
    right_wrist_yaw_joint: 0.05
ppo:
  initial_action_noise_std: 0.15
  learning_rate: 0.0001
reward_experiment:
  active_stage: footstep_bootstrap04
  strict_runtime_set: true
  rewards:
    stage_plan:
      # Units after dt cancellation: acquisition/failure per event,
      # progress per 0.10 m new-best distance, clearance <=1 per target.
      # No clock terms: the plan says WHERE, the policy chooses WHEN.
      # Plan: 2 ground approach targets + 3 treads + 2 platform = 7 targets.
      # Full plan estimate (audit before training): 14 acq + ~13 progress
      #   + ~3 clearance. After the plan the command is zeroed (stand).
      # Unitree's own objective and weights (unitree_rl_lab 4960b84), all envs,
      # so the prior's gait is still rewarded. Left out because they fight
      # stair rise: base_height, lin_vel_z; feet_clearance is flat-only.
      footstep_bootstrap04:
        track_lin_vel_xy: 1.0
        track_ang_vel_z: 0.5
        alive: 0.15
        base_angular_velocity: -0.05
        joint_vel: -0.001
        joint_acc: -2.5e-07
        energy: -2.0e-05
        joint_deviation_arms: -0.1
        joint_deviation_waists: -1.0
        joint_deviation_legs: -1.0
        gait: 0.5
        flat_feet_clearance: 1.0
        undesired_contacts: -1.0
        footstep_acquisition: 2.0
        footstep_target_progress: 0.5
        upright: -5.0
        action_rate: -0.05
        dof_pos_limits: -5.0
        feet_slide: -0.2
        footstep_clearance_progress: 1.0
        footstep_failure_termination: -5.0
        # Extra on stalls (total -12): model 300 parked before the riser
        # because ~4 s of per-second reward (~1.35/s measured) then -5 beat
        # attempting and falling quickly (-5 after ~1 s).
        footstep_stall_termination: -7.0
# 4 cm prior baseline reviewed (2026-10-28): gait intact, trips at riser.
launch_gates:
  allow_launch: true
