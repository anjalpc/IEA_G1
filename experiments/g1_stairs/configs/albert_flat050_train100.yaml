schema_version: 1

inheritance:
  base_config: experiments/g1_stairs/configs/albert_single04_no_stall_train100.yaml
  resolved_config_required: true

experiment:
  id: albert_flat050_train100
  purpose: >
    Determine whether the verified longer 0.50 m/s Unitree gait remains intact
    during flat-only PPO before adding gait rewards or stair exposure.

execution:
  environments: 512
  maximum_iterations: 100
  training_seed: 42

checkpointing:
  interval_iterations: 10

policy_initialization:
  type: rsl_rl_checkpoint_actor_transfer
  source:
    task: albert_flat04_mixed_model0
    path: /workspace/IEA_G1/experiments/g1_stairs/logs/rsl_rl/unitree_iea_g1_29dof_stairs_v0/albert_flat04_mixed_train300_20261020_145201/model_0.pt
  locomotion_observations: 480
  terrain_observations: 0
  stair_observations: 485
  actions: 29
  critic_initialization: fresh
  optimizer_initialization: fresh

terrain:
  riser_heights_m: [0.0]
  curriculum:
    enabled: false

commands:
  forward_velocity_mps: 0.50
  lateral_velocity_mps: [0.0, 0.0]
  yaw_velocity_radps: [0.0, 0.0]

command:
  forward_velocity_mps: 0.50

reward_experiment:
  active_stage: geometry_locomotion_albert_single04
  strict_runtime_set: true
  rewards:
    stage_plan:
      geometry_locomotion_albert_single04:
        track_lin_vel_xy: 1.0
        track_ang_vel_z: 0.5
        alive: 0.15
        upright: -5.0
        base_angular_velocity: -0.05
        joint_vel: -0.001
        joint_acc: -2.5e-7
        action_rate: -0.05
        dof_pos_limits: -5.0
        energy: -2.0e-5
        joint_deviation_arms: -0.1
        joint_deviation_waists: -1.0
        joint_deviation_legs: -1.0
        gait: 0.5
        feet_slide: -0.2
        undesired_contacts: -1.0
        forward_stall: 0.0
