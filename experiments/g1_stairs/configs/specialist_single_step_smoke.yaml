schema_version: 1

experiment:
  id: specialist_single_step_smoke
  purpose: >
    One-iteration integration smoke for the geometry-driven single-step
    specialist reward. This validates reward construction, bounded raw-term
    diagnostics, and runtime contracts; it is not a learning result.
  type: contract_smoke
  meaningful_stair_training: false

inheritance:
  base_config: experiments/g1_stairs/configs/specialist_single_step_base.yaml
  resolved_config_required: true

execution:
  environments: 32
  maximum_iterations: 1
  training_seed: 42

launch_gates:
  allow_launch: true
