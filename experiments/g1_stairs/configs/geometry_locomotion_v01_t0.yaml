schema_version: 1

experiment:
  id: geometry_locomotion_v01_t0
  purpose: >
    Zero-training qualification of the official Unitree G1 velocity actor
    on the deployment-aligned plant with 480-D locomotion history plus
    5-D explicit stair geometry.
  type: geometry_conditioned_locomotion_t0
  meaningful_stair_training: false

inheritance:
  base_config: experiments/g1_stairs/configs/nominal_stairs_base.yaml
  resolved_config_required: true

code:
  project_branch: g1-geometry-locomotion
  require_clean_worktree: true

terrain:
  riser_height_m: 0.12
  riser_height_range_m:
    - 0.12
    - 0.12
  tread_depth_m: 0.25
  step_count: 3

command:
  forward_velocity_mps: 0.35

observations:
  history_length: 5
  actor_height_scan: false
  critic_height_scan: true
  policy_order:
    - base_angular_velocity
    - projected_gravity
    - velocity_command
    - joint_position_offset
    - joint_velocity
    - previous_action
    - explicit_stair_geometry

policy_initialization:
  type: unitree_velocity_onnx_transfer

  source:
    task: Unitree-G1-29dof-Velocity
    path: /workspace/unitree_rl_lab/deploy/robots/g1_29dof/config/policy/velocity/v0/exported/policy.onnx

  locomotion_observations: 480
  actor_height_scan_observations: 0
  explicit_geometry_observations: 5
  stair_observations: 485
  actions: 29

  new_observation_initialization: zero
  critic_initialization: fresh
  pretrained_actor_trainable: true

reward_experiment:
  active_stage: geometry_locomotion_v01
  strict_runtime_set: true

  rewards:
    stage_plan:
      geometry_locomotion_v01:
        track_lin_vel_xy: 1.0
        track_ang_vel_z: 0.5
        alive: 0.15
        upright: -5.0
        base_angular_velocity: -0.05
        joint_acc: -2.5e-7
        action_rate: -0.05
        dof_pos_limits: -5.0
        feet_slide: -0.2
        undesired_contacts: -5.0

reward_parameters: null

ppo:
  initial_action_noise_std: 0.15
  learning_rate: 0.0001
  learning_rate_schedule: adaptive
  desired_kl: 0.01
