schema_version: 1

experiment:
  id: specialist_single_step
  purpose: >
    First geometry-driven learning objective for the clean stair specialist.
    Learn one 6 cm step from a stationary near-riser reset using bounded
    physical potentials, stable tread support, body transfer, trailing-foot
    recovery, and a strict terminal success event. No teacher, locomotion
    prior, gait clock, or reward state machine is used.
  type: specialist_stair_skill
  meaningful_stair_training: true

inheritance:
  base_config: experiments/g1_stairs/configs/specialist_base.yaml
  resolved_config_required: true

reward_experiment:
  active_stage: specialist_single_step
  strict_runtime_set: true
  rule: >
    Exact specialist objective. Potential terms return delta-potential/dt so
    configured weights are interpretable as reward for a full 0-to-1 physical
    progression. Event terms return one/dt on onset so their weights are exact
    one-time bonuses or penalties.
  rewards:
    stage_plan:
      specialist_single_step:
        upright: -2.0
        action_rate: -0.01
        joint_acc: -2.5e-7
        dof_pos_limits: -5.0
        undesired_contacts: -1.0
        approach_progress: 1.0
        swing_clearance_progress: 2.5
        upper_foothold_progress: 2.5
        body_transfer_progress: 3.0
        trailing_foot_recovery: 2.0
        riser_strike_event: -2.0
        single_step_success: 6.0

reward_parameters:
  approach_progress:
    preparation_distance_m: 0.18
  swing_clearance_progress:
    activation_distance_m: 0.30
    insertion_target_m: 0.10
    clearance_margin_m: 0.015
  upper_foothold_progress:
    tread_margin_m: 0.015
    foot_height_tolerance_m: 0.025
    support_force_bodyweight_fraction: 0.15
    maximum_supported_foot_speed_mps: 0.15
    minimum_upright_gravity_z: 0.80
  body_transfer_progress:
    transfer_start_before_riser_m: 0.12
    transfer_target_past_riser_m: 0.10
    required_height_fraction: 0.80
  trailing_foot_recovery:
    required_height_fraction: 0.70
  riser_strike_event:
    face_band_m: 0.025
    clearance_margin_m: 0.010
    horizontal_force_bodyweight_fraction: 0.05
  single_step_success:
    minimum_support_score: 0.60
    base_past_riser_margin_m: 0.05
    required_height_fraction: 0.75
    support_minimum_upright_gravity_z: 0.80
    minimum_upright_gravity_z: 0.90
    maximum_root_linear_speed_mps: 0.35
    maximum_root_angular_speed_radps: 0.60
    minimum_dwell_s: 0.12

launch_gates:
  allow_launch: false
