schema_version: 1

inheritance:
  base_config: experiments/g1_stairs/configs/albert_model1200_approach_overspeed.yaml
  resolved_config_required: true

experiment:
  id: albert_spatial_transfer1500
  purpose: Learn alternating spatial swings and latched supported transfers without prescribed ascent speed.
  type: spatial_swing_and_supported_transfer
  meaningful_stair_training: true

execution:
  maximum_iterations: 1500

episode_contract:
  supported_ascent_dwell_s: 0.20
  supported_ascent_touchdown_dwell_s: 0.04
  supported_ascent_minimum_load_share: 0.45
  supported_ascent_transfer_margin_m: 0.05
  supported_ascent_max_roll_pitch_rad: 0.30

reward_experiment:
  rewards:
    stage_plan:
      albert_clean_step_finish:
        supported_alternating_swing_progress: 2.0
        supported_alternating_stair_acquisition: 5.0
        invalid_alternating_stair_sequence: -1.0
        geometry_failure_termination_event: -1.0
        joint_deviation_arms: -0.50
        planar_body_velocity_change: -0.50
        approach_overspeed: -0.50

reward_parameters:
  track_stair_axis_velocity:
    ascent_scale: 0.0
