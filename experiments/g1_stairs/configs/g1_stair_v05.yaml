schema_version: 1

experiment:
  id: g1_stair_v05
  purpose: >
    Bounded qualification of the v04 waypoint arc with the preparation loophole
    closed. Start from the best early v04 actor (model_50): phase 0 now uses a
    bottleneck score, requires the swing foot to stay grounded while unloading,
    and applies support-anchor/pelvis/load penalties before swing begins. The
    forward/up waypoint arc and all later phases remain unchanged.
  type: specialist_stair_support_locked_waypoint
  meaningful_stair_training: true

inheritance:
  base_config: experiments/g1_stairs/configs/specialist_single_step_base.yaml
  resolved_config_required: true

policy_initialization:
  type: rsl_rl_checkpoint_actor_transfer
  source:
    path: /workspace/IEA_G1/experiments/g1_stairs/logs/rsl_rl/unitree_iea_g1_29dof_stairs_v0/g1_stair_v04_20260926_135458/model_50.pt
  critic_initialization: fresh
  optimizer_initialization: fresh
  transfer_action_std: true

reward_experiment:
  active_stage: support_locked_waypoint
  strict_runtime_set: true
  rule: >
    Phase 0 is a non-compensatory preparation gate: support anchoring, swing-foot
    unloading, pelvis placement, body orientation, and grounded swing-foot state
    must all be acceptable together. Phase-0 support drift/load failures are
    penalized immediately. After transition, the v04 forward/up waypoint arc,
    lateral lane, foot orientation, body envelope, touchdown, and transfer logic
    are unchanged.
  rewards:
    stage_plan:
      support_locked_waypoint:
        alive: 0.0
        upright: -5.0
        base_angular_velocity: -0.05
        feet_slide: -0.2
        action_rate: -0.01
        joint_acc: -2.5e-7
        dof_pos_limits: -5.0
        undesired_contacts: -1.0
        failure_termination_event: -4.0
        approach_progress: 0.0
        body_heading_guard: -0.25
        swing_waypoint_progress: 4.0
        swing_waypoint_guard: -1.5
        posture_envelope_guard: -0.25
        upper_foothold_progress: 2.5
        body_transfer_progress: 3.0
        trailing_foot_recovery: 2.0
        riser_strike_event: -2.0
        single_step_success: 6.0

