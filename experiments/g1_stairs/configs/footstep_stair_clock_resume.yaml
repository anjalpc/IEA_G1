schema_version: 1
# Full copy of footstep_stair_clock.yaml (same task, terrain, clock and
# rewards, all listed here), continued from a checkpoint instead of starting
# from the Unitree prior. Inherits from the same base as that file. Before
# training, fill policy_initialization.source.sha256 from the checkpoint.
experiment:
  id: footstep_stair_clock_resume
  purpose: Patch 49. Same as patch 48 (source run 20261104_143016 model_10200, seed 42, paired mean bound 0.01, no std floor, mirror loss 0.1) with the mirror loss computed on clipped means (ppo.symmetry_mirror_loss_clipped true), so it acts on the executed left/right asymmetry (patch 48 stair-parity left turn) instead of out-of-clip raw outputs.
  type: footstep_curriculum_bootstrap
  meaningful_stair_training: false
inheritance:
  base_config: experiments/g1_stairs/configs/nominal_stairs_base.yaml
  resolved_config_required: true
code:
  project_branch: g1-geometry-locomotion
  require_clean_worktree: true
task:
  id: Unitree-IEA-G1-29dof-Stairs-Footsteps-v0
  custom_stair_task_active: true
terrain:
  riser_height_m: 0.04
  # Stage 1: flat tiles (rolling targets, joystick command) and 2 cm stairs
  # (stair plan, one tread per step), at random. Flat walking at this
  # height lifts 1.6-3.2 cm (run 20261029_142532), so 2 cm is reachable;
  # 4 cm only after 2 cm is climbed with alternating feet (0-4 cm at once
  # taught shuffling in footstep_bootstrap04_20261028_141115).
  riser_heights_m:
  - 0.0
  - 0.02
  tread_depth_m: 0.25
  step_count: 3
  curriculum_enabled: false
command:
  terrain_split:
    # Forward walking and turning only for this stage; no backwards or
    # sideways steps yet (the rolling targets support them, untested).
    flat:
      lin_vel_x: [0.0, 0.6]
      lin_vel_y: [0.0, 0.0]
      ang_vel_z: [-0.2, 0.2]
      rel_standing_envs: 0.02
    # Stair tiles: sampled by the command term, then replaced every step by
    # the climbing speed (2 x 0.25 m / period_stairs_s, ~0.45 m/s), also on
    # the approach, which is walked like a flat tile until the hand-over.
    stairs:
      lin_vel_x: [0.2, 0.5]
footstep_clock:
  enabled: true
  # One cycle = left swing + right swing with two double supports, times a
  # per-episode jitter of +-period_jitter so no single rhythm is memorised.
  # Level ground: 1.0 s (<= 0.1 m/s) to 0.7 s (>= 0.6 m/s), as in run
  # 20261031_083022, whose approach (~0.85 s at 0.45 m/s, longer strides)
  # led into one foot per tread. The Unitree 0.6 s cycle (run
  # 20261031_112519 and its resume 20261031_151508) gave smoother flat
  # walking but both feet, then three touchdowns, on every tread.
  period_slow_s: 1.0
  period_fast_s: 0.7
  # Stair tiles, once the stair plan has taken over: fixed cycle, one
  # 0.25 m tread per step (~0.45 m/s, 0.39 s swing window). 1.1 s is the
  # slowest cycle the flat stage demonstrated; 1.3 s was never followed
  # (run 20261029_160519: steps every 0.18-0.22 s, lift-off in the own
  # window at chance level).
  period_stairs_s: 1.1
  period_jitter: 0.1
  # Stride (two steps) = speed x cycle time, capped here: above the cap only
  # the rhythm gets quicker.
  max_stride_m: 0.55
execution:
  environments: 2048
  # Resumed run: 1000 more iterations after the checkpoint's own.
  maximum_iterations: 1000
  training_seed: 42
# Residual on the frozen official Unitree policy (balance_residual_control);
# the actor sees all 688 inputs. Policy, critic, optimizer and learning rate
# are restored from the checkpoint (training_resume.py checks the SHA256);
# the simulator state is not.
policy_initialization:
  type: rsl_rl_training_resume
  source:
    path: /workspace/IEA_G1/experiments/g1_stairs/logs/rsl_rl/unitree_iea_g1_29dof_stairs_v0/footstep_stair_clock_resume_20261104_143016/model_10200.pt
    sha256: e0ed1a76e9ff0dd331440c3c253eba661fa504c868c8aa416623b39de5a49860
  critic_initialization: restored
  optimizer_initialization: restored
  locomotion_observations: 480
  terrain_observations: 187
  explicit_geometry_observations: 5
  planned_footstep_observations: 14
  gait_clock_observations: 2
  stair_observations: 688
  actions: 29
balance_residual_control:
  enabled: true
  teacher_onnx: /workspace/unitree_rl_lab/deploy/robots/g1_29dof/config/policy/velocity/v0/exported/policy.onnx
  teacher_observation_dim: 480
  # Patch 44: teacher output replaced by (T(s) + M T(M s)) / 2
  # (balance_residual.MirrorAveragedTeacher); deployment must do the same.
  teacher_symmetry: average
  # Raw Unitree action units (x 0.25 rad). Legs: up to +-2 units = +-0.5 rad
  # for riser lift and foot placement; waist and arms stay near the teacher.
  residual_clip: 2.0
  executed_clip: 5.0
  scale_by_joint:
    left_hip_pitch_joint: 1.00
    right_hip_pitch_joint: 1.00
    waist_yaw_joint: 0.15
    left_hip_roll_joint: 0.30
    right_hip_roll_joint: 0.30
    waist_roll_joint: 0.15
    left_hip_yaw_joint: 0.30
    right_hip_yaw_joint: 0.30
    waist_pitch_joint: 0.15
    left_knee_joint: 1.00
    right_knee_joint: 1.00
    left_shoulder_pitch_joint: 0.10
    right_shoulder_pitch_joint: 0.10
    left_ankle_pitch_joint: 1.00
    right_ankle_pitch_joint: 1.00
    left_shoulder_roll_joint: 0.10
    right_shoulder_roll_joint: 0.10
    left_ankle_roll_joint: 0.30
    right_ankle_roll_joint: 0.30
    left_shoulder_yaw_joint: 0.10
    right_shoulder_yaw_joint: 0.10
    left_elbow_joint: 0.10
    right_elbow_joint: 0.10
    left_wrist_roll_joint: 0.05
    right_wrist_roll_joint: 0.05
    left_wrist_pitch_joint: 0.05
    right_wrist_pitch_joint: 0.05
    left_wrist_yaw_joint: 0.05
    right_wrist_yaw_joint: 0.05
ppo:
  # Left/right mirror augmentation (footstep_symmetry.compute_symmetric_states,
  # rsl-rl-lib 3.0.1 symmetry_cfg): each update batch is doubled with its
  # mirror image (patch 40).
  symmetry_augmentation: true
  # Mirror loss: coeff * mean((pi(M s) - M pi(s))^2) on the action means,
  # as in patch 41 (patch 42's 0.2 cost speed tracking and body calm).
  symmetry_mirror_loss_coeff: 0.1
  # Patch 49: mirror loss on clamp(mean, +-residual_clip) (policy_shaping.py).
  symmetry_mirror_loss_clipped: true
  # Patch 43: on resume, cap the restored exploration std at 0.5 (raw policy
  # units, residual clip 2) and make it left/right symmetric; no entropy
  # bonus, so it does not grow back (agent_cfg default 0.005).
  resume_action_noise_std_cap: 0.5
  entropy_coef: 0.0
  # Patch 46 (policy_shaping.py): L1 bound on residual means beyond the clip
  # (dead zone, ~70% of outputs). Patch 47: std floor removed (it caused the
  # p46 forward lean and riser stall). Patch 48: paired bound, left/right
  # pairs reach the clip together.
  action_mean_bound_coeff: 0.01
  action_mean_bound_paired: true
  action_std_floor: 0.0
  initial_action_noise_std: 0.15
  learning_rate: 0.0001
reward_experiment:
  active_stage: footstep_stair_clock
  strict_runtime_set: true
  rewards:
    stage_plan:
      # Units after dt cancellation: acquisition/failure per event,
      # progress per 0.10 m new-best distance. Clock terms per second in
      # [-1, 1]. The clock says WHEN, the targets say WHERE (rolling on
      # flat tiles, the stair plan on stairs). Same weights as the flat
      # clock stage (run 20261029_142532), so the only change is the stairs.
      # Unitree's own objective and weights (unitree_rl_lab 4960b84) except
      # its gait term and foot clearance (replaced by swing_clearance). Stall
      # fires on stair tiles.
      footstep_stair_clock:
        track_lin_vel_xy: 1.0
        track_ang_vel_z: 0.5
        alive: 0.15
        # Pelvis roll/pitch rate squared (Isaac Lab ang_vel_xy_l2). -0.05
        # (Unitree G1) cost 0.03/s at model_3700 sway. -0.5 (patch 36) cut
        # flat roll sd 41 -> 28.5 deg/s by model_4700 but not pitch (22-25).
        # -1.5: model_4000 sway (l2 0.50 flat, 0.61 stairs) costs 0.75-0.9/s,
        # Unitree-level sway (l2 0.06) 0.09/s.
        # Patch 39: the term now also charges yaw rate minus commanded yaw
        # rate (footstep_rewards.body_rate_l2); commanded turns stay free.
        # model_5600 pelvis twist ~0.37 rad^2/s^2 adds ~0.55/s at -1.5.
        base_angular_velocity: -1.5
        joint_vel: -0.001
        joint_acc: -2.5e-07
        energy: -2.0e-05
        joint_deviation_arms: -0.1
        joint_deviation_waists: -1.0
        joint_deviation_legs: -1.0
        # Unitree's gait term (fixed 0.8 s cycle) is replaced by the clock:
        # loaded stance foot, moving swing foot, per the scheduled phase.
        # 3.0 (was 1.0): at 1.0 the target terms (~5/s) outweighed the clock
        # (~0.8/s) and the policy kept a foot loaded through its swing window
        # (run 20261028_222026: left foot loaded 58% of its window by 1499).
        clock_stance_support: 3.0
        clock_swing_motion: 3.0
        # Uncommanded rotation, per second, cost >= 0 (quadratic to 2 deg/s,
        # linear beyond; was 1 - exp(-q^2), saturated at model_3499): yaw-rate error
        # averaged over each gait cycle (std 2 deg/s). The per-step Unitree
        # term (std 0.5 rad/s) cannot see a 1 deg/s drift under the in-step
        # twist (run 20261029_110922: -12 deg in 10 s, cost 0.0005/s). Same
        # scale as the clock terms. Rates only: no heading is stored.
        uncommanded_yaw: -3.0
        # Swing clearance, per second in [0, 1]: the clock's swing sole above
        # the ground under it, as a fraction of (what it must clear + 5 cm):
        # the floor on flat tiles, the target level in front of a riser.
        # Credit capped from half the swing window down to 0 at its end
        # (patch 36): hovering late pays nothing, so the sole comes down
        # gradually instead of dropping in the last tenth.
        # Replaces Unitree's foot clearance (pays ~0.97 at the prior's 1.5 cm,
        # flat tiles only) and the once-per-tread lift credit. Run
        # 20261030_092747: swing sole apex 0.9-1.3 cm on the steps that jammed
        # against a 2 cm riser, 2.3 cm on those that got over. Same scale as
        # the clock terms.
        swing_clearance: 3.0
        # Unitree's feet_stumble: a foot pushing into a vertical face, cost
        # 1 per contact step (a third of a target hit). Run 20261031_083022:
        # swing toes driven into riser faces in 1.2% of stair steps (up to
        # 1.8 kN horizontal), never on flat ground or for the Unitree prior.
        foot_stumble: -1.0
        # Stair plan only: a step (moved >= 5 cm) lifted off outside its
        # foot's turn (its swing window or the double support before it),
        # 1 per step (a third of a target hit). Run 20261031_112519: with
        # extra steps free, both feet landed on every tread (59 extra steps
        # for 50 hits at model_1499) instead of one foot per tread. Also, a
        # stair hit after an off-beat step pays no acquisition (the plan
        # still advances): without that, step-to cost ~1.6 per target and
        # could still beat a riskier 50 cm alternating stride.
        off_beat_step: -1.0
        # Landing impact, per touchdown: ((v - 0.3) / 0.3)^2 for the sole
        # downward speed v above 0.3 m/s (Unitree prior 0.20). Run
        # 20261031_212003 model_3700: 0.48 m/s flat, 0.81 m/s stairs (p90
        # 1.0), peak normal force up to 6 body weights, waist roll at its
        # 25 Nm limit in 2-3% of frames. At 0.8 m/s: 1.4 per landing, half
        # a target hit.
        landing_impact: -0.5
        undesired_contacts: -1.0
        # Acquisition 3.0 per hit (was 1.0) to match the clock weight: with
        # clock 3.0 and acquisition 1.0 the path drifted 12 cm sideways (run
        # 20261029_082518, hits 7/25 at 0.35 m/s). Progress stays 0.5: setting
        # it to 0 removed the steering signal (run 20261029_094644: heading
        # drift +47 deg in 12 s, right foot loaded 35-60% of its window).
        footstep_acquisition: 3.0
        footstep_target_progress: 0.5
        upright: -5.0
        action_rate: -0.05
        dof_pos_limits: -5.0
        feet_slide: -0.2
        footstep_failure_termination: -1.0
        footstep_stall_termination: -1.0
        # Cost of changing the frozen Unitree action, per second, raw action
        # units squared. -0.5 (was -0.1): at -0.1 the correction cost was
        # ~0.06/s against ~9/s of reward, and every run with good placement
        # walked stop-and-go with a rocking pelvis (run 20261029_130700:
        # speed std within a step 0.105 m/s vs Unitree 0.013, pitch rate
        # 26 deg/s vs 7). Unitree's own motion is smooth; this keeps the
        # policy closer to it. Same value as the stair runs.
        residual_magnitude: -0.5
launch_gates:
  allow_launch: true
