schema_version: 1
# Continue a footstep_stair_clock run (same task, rewards and terrain) from
# one of its checkpoints: policy, critic, optimizer and learning rate are
# restored, the simulator state is not. Fill source.sha256 from the
# checkpoint before training (training_resume.py checks it).
experiment:
  id: footstep_stair_clock_resume
  purpose: Continue footstep_stair_clock run 20261030_112528 from model_499
    (riser jams 88% -> 33%, swing lift 1.3 -> 3.0 cm over 150-499; not
    levelled off) for 1000 more iterations, to iteration 1499.
inheritance:
  base_config: experiments/g1_stairs/configs/footstep_stair_clock.yaml
  resolved_config_required: true
execution:
  maximum_iterations: 1000
policy_initialization:
  type: rsl_rl_training_resume
  source:
    path: /workspace/IEA_G1/experiments/g1_stairs/logs/rsl_rl/unitree_iea_g1_29dof_stairs_v0/footstep_stair_clock_20261030_112528/model_499.pt
    sha256: eb21036d457a693198b3120b4085b6b6e20cb0187f373505016b3c1841ef4ada
  critic_initialization: restored
  optimizer_initialization: restored
