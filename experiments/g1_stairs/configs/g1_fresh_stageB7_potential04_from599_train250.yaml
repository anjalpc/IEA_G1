  resolved_config_required: true

experiment:
  id: g1_fresh_stageB7_potential04_from599_train250
  purpose: >-
    Discount-correct sequence shaping for CLEAN_STEP_OVER.
    Preserve B6 canonical transition semantics and +3.0 CLEAN reward.
    Add Phi=0.5 after the first verified DIRECT transition and no
    additional alternation-specific failure penalty.

