    waist_deviation_raw:
      active_weight: -1.0
    forward_progress_raw:
      active_weight: 1.0
    stair_progress_raw:
      active_weight: 1.0

  stage_plan:
    pretrained_D:
      enabled_terms:
        track_lin_vel_xy_raw: 1.0
        upright_raw: -5.0
        action_rate_raw: -0.05
        waist_deviation_raw: -1.0
        forward_progress_raw: 1.0
        stair_progress_raw: 1.0
