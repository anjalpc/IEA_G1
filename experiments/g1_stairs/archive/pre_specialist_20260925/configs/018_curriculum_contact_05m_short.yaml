schema_version: 1

experiment:
  id: 018_curriculum_contact_05m_short
  purpose: Short pretrained locomotion fine-tuning trial on 5 cm curriculum stairs
  type: pretrained_finetuning_trial
  meaningful_stair_training: true

inheritance:
  base_config: experiments/g1_stairs/configs/nominal_stairs_base.yaml
  resolved_config_required: true

execution:
  environments: 128
  maximum_iterations: 200

reward_experiment:
  active_stage: pretrained_A
  rule: Preserve basic locomotion while adding minimal stair progress objectives

rewards:
  always_logged:
    track_lin_vel_xy_raw:
      active_weight: 1.0
    upright_raw:
      active_weight: -5.0
    action_rate_raw:
      active_weight: -0.05
    waist_deviation_raw:
      active_weight: -1.0
    forward_progress_raw:
      active_weight: 1.0
    stair_progress_raw:
      active_weight: 1.0

  stage_plan:
    pretrained_A:
      enabled_terms:
        track_lin_vel_xy_raw: 1.0
        upright_raw: -5.0
        action_rate_raw: -0.05
        waist_deviation_raw: -1.0
        forward_progress_raw: 1.0
        stair_progress_raw: 1.0
        validated_tread_contact_raw: 1.5

terrain:
  riser_height_m: 0.05

command:
  forward_velocity_mps: 0.22

ppo:
  initial_action_noise_std: 0.25
  learning_rate: 0.0001
