schema_version: 1

experiment:
  id: 003_nominal_reward_debug
  purpose: Determine whether the fixed nominal stair task is learnable without reward hacking
  type: tiny_overfit_learning_test
  status: blocked_pending_evaluator_and_metrics
  meaningful_stair_training: true

inheritance:
  base_config: experiments/configs/002_stairs_smoke.yaml
  resolved_config_required: true
  note: All inherited values must be expanded into resolved_config.yaml before launch

code:
  project_branch: g1-stair-rl
  project_commit: resolved_from_clean_worktree_at_launch
  require_clean_worktree: true
  unitree_rl_lab_commit: 4960b84732b0c2ec593dccbfe963fda1bcd7b1e3

execution:
  provider: aws
  instance_type: g6.4xlarge
  device: cuda:0
  headless: true
  environments: 128
  maximum_iterations: 2000
  training_seed: 42
  evaluation_seeds: [1001, 1002, 1003, 1004, 1005]
  deterministic_torch: false

launch_gates:
  independent_evaluator_implemented: true
  essential_metrics_implemented: false
  fixed_evaluation_cameras_implemented: true
  aws_upstream_validation_passed: true
  staircase_geometry_validation_passed: true
  allow_launch: false

metric_deferrals:
  approximate_kl:
    reason: RSL-RL 2.3.1 computes adaptive KL internally but does not expose it in loss_dict
    required_before: PPO ablation studies
  clip_fraction:
    reason: RSL-RL 2.3.1 does not expose clipped-sample fraction
    required_before: PPO ablation studies
  inactive_reward_components:
    reason: Experiment A instantiates only forward and stair progress by design
    required_before: activating the corresponding B-to-G reward stage
  automatic_periodic_evaluation:
    reason: Checkpoints are persisted every 50 iterations; independent evaluation is launched separately
    required_before: final multi-seed checkpoint selection

task:
  id: Unitree-IEA-G1-29dof-Stairs-v0
  episode_length_s: 18.0
  objective: Learn genuine ascent of the exact fixed nominal staircase

robot:
  variant: G1_EDU_U7
  mode_machine: 5
  policy_dofs: 29
  brainco_hands:
    required_before_final_training: true
    included_in_this_debug_asset: false
    locomotion_action_channels: 0

timing:
  physics_timestep_s: 0.005
  physics_frequency_hz: 200
  decimation: 4
  control_timestep_s: 0.020
  control_frequency_hz: 50
  policy_frequency_hz: 50
  observation_latency_s: 0.0
  action_latency_s: 0.0

observations:
  history_length: 5
  policy_order:
    - base_angular_velocity
    - projected_gravity
    - velocity_command
    - joint_position_offset
    - joint_velocity
    - previous_action
    - local_terrain_height_scan
  action_history_included: true
  terrain_scan_in_actor: true
  terrain_scan_in_critic: true

actions:
  inherit_complete_definition_from: experiments/configs/001_upstream_flat_ground.yaml
  type: joint_position_offset
  dimension: 29
  scale: 0.25
  use_default_joint_offset: true
  smoothing: none

commands:
  forward_velocity_mps: [0.35, 0.35]
  lateral_velocity_mps: [0.0, 0.0]
  yaw_velocity_radps: [0.0, 0.0]

terrain:
  type: fixed_three_step_ascent
  riser_height_m: 0.20
  tread_depth_m: 0.25
  step_count: 3
  total_rise_m: 0.60
  platform_length_m: 3.0
  required_platform_continuation_m: 2.0
  curriculum_enabled: false

start_pose:
  distribution: fixed
  distance_before_first_riser_m: 1.0
  lateral_offset_m: 0.0
  orientation_rpy_rad: [0.0, 0.0, 0.0]
  position_randomization_m: [0.0, 0.0, 0.0]
  yaw_randomization_rad: 0.0

reset_distribution:
  base_pose: fixed
  base_velocity: fixed_zero
  joint_position_scale: [1.0, 1.0]
  joint_velocity_radps: [0.0, 0.0]

domain_randomization:
  enabled: false
  rigid_body_material: false
  added_mass: false
  pushes: false
  observation_noise: false
  action_latency: false

reward_experiment:
  active_stage: A_progress_only
  rule: Change only one reward group between experiments
  reject_change_if:
    - validation_success_decreases
    - fall_rate_increases
    - forbidden_contacts_increase
    - torque_violations_increase
    - motion_jerk_increases_badly

rewards:
  aggregation: weighted_sum_per_step
  clipping: none

  always_logged:
    forward_progress_raw:
      formula: base_position_x_t_minus_base_position_x_previous
      units: m_per_step
      active_weight: 1.0

    upward_progress_raw:
      formula: positive_part_of_base_height_t_minus_base_height_previous
      units: m_per_step
      active_weight: 0.0

    stair_progress_raw:
      formula: maximum_step_index_reached_minus_previous_maximum_step_index
      units: steps
      active_weight: 1.0

    completion_raw:
      formula: first_entry_into_valid_success_state
      active_weight: 0.0

    upright_raw:
      formula: projected_gravity_alignment
      active_weight: 0.0

    forbidden_contact_raw:
      formula: count_of_new_forbidden_contact_events
      active_weight: 0.0

    fall_raw:
      formula: first_transition_into_fall_state
      active_weight: 0.0

    feet_clearance_raw:
      formula: foot_clearance_tracking_error
      active_weight: 0.0

    feet_slip_raw:
      formula: stance_foot_horizontal_slip_speed
      active_weight: 0.0

    joint_limit_raw:
      formula: joint_limit_violation_magnitude
      active_weight: 0.0

    velocity_limit_raw:
      formula: joint_velocity_limit_violation_magnitude
      active_weight: 0.0

    torque_limit_raw:
      formula: actuator_torque_limit_violation_magnitude
      active_weight: 0.0

    action_rate_raw:
      formula: squared_action_difference
      active_weight: 0.0

    joint_jerk_raw:
      formula: finite_difference_joint_acceleration
      active_weight: 0.0

    mechanical_power_raw:
      formula: sum_absolute_joint_torque_times_joint_velocity
      active_weight: 0.0

  stage_plan:
    A_progress_only:
      enabled_terms:
        forward_progress_raw: 1.0
        stair_progress_raw: 1.0

    B_add_upright:
      enabled_terms:
        upright_raw: pending_tuning

    C_add_completion:
      enabled_terms:
        completion_raw: pending_tuning

    D_add_safety:
      enabled_terms:
        forbidden_contact_raw: pending_tuning
        fall_raw: pending_tuning

    E_add_foot_control:
      enabled_terms:
        feet_clearance_raw: pending_tuning
        feet_slip_raw: pending_tuning

    F_add_physical_constraints:
      enabled_terms:
        joint_limit_raw: pending_tuning
        velocity_limit_raw: pending_tuning
        torque_limit_raw: pending_tuning
        mechanical_power_raw: pending_tuning

    G_add_smoothness:
      enabled_terms:
        action_rate_raw: pending_tuning
        joint_jerk_raw: pending_tuning

success_definition:
  independent_from_reward: true
  requirements:
    approach_staircase: true
    ascend_step_1: true
    ascend_step_2: true
    ascend_step_3: true
    reach_upper_platform: true
    travel_after_final_step_m: 2.0
    upright_dwell_s: 1.0
    forbidden_contacts: false
    joint_limit_violation: false
    velocity_limit_violation: false
    torque_limit_violation: false

fall_definition:
  any_of:
    base_height_below_m: 0.45
    absolute_roll_above_rad: 0.8
    absolute_pitch_above_rad: 0.8
    torso_contact: true
    pelvis_contact: true
    invalid_simulation_state: true

failure_categories:
  primary_priority_order:
    - invalid_simulation_state
    - fall
    - torque_violation
    - velocity_violation
    - joint_violation
    - forbidden_contact
    - wrong_direction
    - slip
    - stall
    - timeout
  preserve_secondary_flags: true

forbidden_contacts:
  - torso
  - pelvis
  - left_knee
  - right_knee
  - left_forearm
  - right_forearm
  - left_hand
  - right_hand

ppo:
  rollout_steps_per_environment: 24
  actor_hidden_dimensions: [512, 256, 128]
  critic_hidden_dimensions: [512, 256, 128]
  activation: elu
  initial_action_noise_std: 1.0
  value_loss_coefficient: 1.0
  clipped_value_loss: true
  clip_range: 0.2
  entropy_coefficient: 0.005
  learning_epochs: 5
  minibatches: 4
  learning_rate: 0.001
  learning_rate_schedule: adaptive
  discount_gamma: 0.99
  gae_lambda: 0.95
  desired_kl: 0.01
  maximum_gradient_norm: 1.0
  observation_normalization: false

checkpointing:
  interval_iterations: 50
  save_new_best_validation: true
  preserve_optimizer_state: true
  never_overwrite: true
  filename_fields:
    - run_id
    - iteration
    - simulated_steps
  attach_resolved_config: true
  calculate_sha256: true

evaluation:
  interval_iterations: 50
  episodes_per_seed: 20
  screening_episode_total: 100
  training_seeds_excluded: true
  select_by_training_return: false
  candidate_score_components:
    - success_rate
    - fall_rate
    - forbidden_contact_rate
    - constraint_compliance
    - stability
    - action_smoothness

essential_metrics:
  rewards:
    - total
    - every_raw_component
    - every_weighted_component
  outcomes:
    - success
    - fall
    - timeout
    - stall
    - slip
    - forbidden_contact
  progress:
    - maximum_x
    - maximum_base_height
    - maximum_step_reached
    - platform_reached
    - final_distance_after_platform
  constraints:
    - joint_limit_violations
    - velocity_limit_violations
    - torque_limit_violations
    - action_saturation_count
  motion:
    - action_rate
    - joint_jerk
    - mechanical_power
  ppo:
    - policy_loss
    - value_loss
    - entropy
    - approximate_kl
    - clip_fraction
    - learning_rate
  performance:
    - simulation_fps
    - environment_steps_per_second
    - gpu_memory
    - wall_clock_time
    - nan_count

recording:
  training_rendering: false
  periodic_evaluation_video: true
  camera_views:
    - side
    - front
    - foot_close_up
    - slow_motion_contact
  associate_video_with_checkpoint: true

stop_conditions:
  - any_nan_or_infinity
  - invalid_reset
  - unstable_physics
  - success_rate_not_improving_after_defined_review_window
  - reward_increases_while_safety_metrics_worsen
  - repeated_collision_exploitation
