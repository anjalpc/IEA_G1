g1_hardware_bridge:
  ros__parameters:
    network_interface: eth0
    action_timeout_s: 5.0
    safe_hand_ramp_s: 0.2
    arm_state_stale_timeout_s: 2.0
    arm_idle_stable_s: 0.5
    allowed_arm_actions: [27]
    # No rt/arm_sdk publisher exists in this stage.
    card_presentation_mode: live
    # BrainCo order: thumb, thumb_aux, index, middle, ring, pinky.
    right_hand_neutral_target: [0.399, 0.399, 0.050, 0.050, 0.049, 0.050]
    left_hand_neutral_target: [0.400, 0.400, 0.049, 0.050, 0.049, 0.050]
