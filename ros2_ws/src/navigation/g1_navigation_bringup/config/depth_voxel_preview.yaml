# Offline fixed-floor-reference experiment; never a controller input.
/costmap/costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: depth_preview_ground
    robot_base_frame: depth_preview_ground
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.05
    robot_radius: 0.35
    update_frequency: 5.0
    publish_frequency: 2.0
    always_send_full_costmap: true
    plugins:
    - depth_obstacles
    depth_obstacles:
      plugin: nav2_costmap_2d::VoxelLayer
      enabled: true
      footprint_clearing_enabled: false
      min_obstacle_height: -2.0
      max_obstacle_height: 2.0
      observation_sources: depth depth_rays
      depth:
        topic: /g1/diagnostics/depth/costmap_input
        data_type: PointCloud2
        sensor_frame: depth_preview_camera
        marking: true
        clearing: false
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        obstacle_min_range: 0.0
        obstacle_max_range: 3.0
        observation_persistence: 0.0
        expected_update_rate: 0.0
      origin_z: -0.07
      z_resolution: 0.1
      z_voxels: 16
      unknown_threshold: 15
      mark_threshold: 0
      publish_voxel_map: false
      depth_rays:
        topic: /g1/diagnostics/depth/costmap_clear
        data_type: PointCloud2
        sensor_frame: depth_preview_camera
        marking: false
        clearing: true
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        obstacle_min_range: 0.0
        obstacle_max_range: 3.0
        observation_persistence: 0.0
        expected_update_rate: 0.0
        raytrace_min_range: 0.0
        raytrace_max_range: 3.0
