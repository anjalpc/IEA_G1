# Offline/body-relative marking preview only; never a controller input.
/costmap/costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: pelvis
    robot_base_frame: pelvis
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.05
    robot_radius: 0.35
    update_frequency: 5.0
    publish_frequency: 2.0
    always_send_full_costmap: true
    plugins:
    - depth_obstacles
    depth_obstacles:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      footprint_clearing_enabled: false
      min_obstacle_height: -2.0
      max_obstacle_height: 2.0
      observation_sources: depth
      depth:
        topic: /g1/diagnostics/depth/costmap_input
        data_type: PointCloud2
        sensor_frame: pelvis
        marking: true
        clearing: false
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        obstacle_min_range: 0.0
        obstacle_max_range: 3.0
        observation_persistence: 0.0
        expected_update_rate: 0.0
