hand_presence:
  ros__parameters:
    min_detection_confidence: 0.5
    detection_max_width: 1280

    required_stable_frames: 2
    stability_window_frames: 4

    # Normalized Unitree RGB coordinates; calibrate using the debug feed.
    target_x_min: 0.58
    target_y_min: 0.20
    target_x_max: 0.84
    target_y_max: 0.78
    min_hand_area_ratio: 0.01

    depth_roi_x: 381
    depth_roi_y: 170
    depth_roi_width: 193
    depth_roi_height: 181
    depth_near25_below_mm: 800.0
    rgb_recent_s: 2.0

    poll_rate_hz: 10.0
    rgb_stale_after_s: 0.25
    depth_stale_after_s: 0.5
    publish_debug_image: true

    # Physical handshake grip trigger.
    enable_grip_trigger: true
