g1_simulation_bridge:
  ros__parameters:
    # Simulation order matches the BrainCo bridge command order.
    right_hand_neutral_target: [0.399, 0.399, 0.050, 0.050, 0.049, 0.050]
    left_hand_neutral_target: [0.400, 0.400, 0.049, 0.050, 0.049, 0.050]

    # Raw navigation-state source contract.
    state_period_seconds: 0.02
    imu_frame_id: pelvis
    odom_frame_id: odom
    odom_child_frame_id: pelvis
    state_covariance_variance: 1.0e-6
