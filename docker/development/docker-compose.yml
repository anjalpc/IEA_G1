services:
  iea_g1_dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}

    image: iea_g1_dev:humble
    container_name: iea_g1_dev

    network_mode: host

    volumes:
      - ../../:/workspace/IEA_G1

    working_dir: /workspace/IEA_G1

    stdin_open: true
    tty: true
