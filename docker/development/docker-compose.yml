services:
  iea_g1_dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}

    image: iea_g1_dev:humble
    container_name: iea_g1_dev

    network_mode: host

    environment:
      IEA_G1_CONTAINER: "1"
      TERM: xterm-256color

    volumes:
      - ../../:/workspace/IEA_G1

    working_dir: /workspace/IEA_G1

    stdin_open: true
    tty: true

  g1_dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard

    image: iea_g1_dashboard:node24
    container_name: iea_g1_dashboard

    network_mode: host

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    environment:
      HOME: /tmp/g1-dashboard-home

    volumes:
      - ../:/workspace/IEA_G1

    working_dir: /workspace/IEA_G1/dashboard/frontend

    stdin_open: true
    tty: true

  g1_dashboard_backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard-backend

    image: iea_g1_dashboard_backend:python311
    container_name: iea_g1_dashboard_backend

    network_mode: host

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    environment:
      HOME: /tmp/g1-dashboard-backend-home
      PYTHONPATH: /workspace/IEA_G1/dashboard/backend

    volumes:
      - ../:/workspace/IEA_G1

    working_dir: /workspace/IEA_G1/dashboard/backend

    stdin_open: true
    tty: true
